<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agricheck Kontrollpunkte-Liste</title>

  <!-- Bootstrap + icons -->
   <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/main.css">
  
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="container py-4">

    <!-- Meta headline + date -->
    <h1 class="mb-2">Meine Agricheck-Liste</h1>
    <p id="metaDate" class="text-muted mb-4"></p>

    <!-- Toolbar (hidden for print) -->
    <div id="toolbar" class="d-print-none mb-3">
      <button id="printBtn"    class="btn btn-outline-secondary me-2">
        <i class="bi bi-printer"></i> Drucken / PDF
      </button>
      <button id="excelBtn"    class="btn btn-outline-secondary me-2">
        <i class="bi bi-file-earmark-excel"></i> Excel
      </button>
      <button id="copyLinkBtn" class="btn btn-outline-secondary">
        <i class="bi bi-clipboard"></i> Link kopieren
      </button>
    </div>

    <!-- Checklist content -->
    <div id="content"></div>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ once:true });</script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page logic -->
  <script type="module" src="js/checklist.js"></script>
  <script src="js/layout.js"></script>

</body>
</html>
