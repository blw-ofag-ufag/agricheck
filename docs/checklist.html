<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agricheck Kontrollpunkte-Liste</title>

  <!-- Bootstrap + icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- Agricheck Navbar -->
  <nav class="navbar navbar-agricheck mb-4">
    <div class="container-fluid">

      <!-- Brand: calendar-check icon + text -->
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-calendar-check fs-3 me-2"></i>
        <span class="fs-3 fw-bold">Agricheck</span>
      </a>


      <!-- Feedback links -->
      <div class="d-flex align-items-center ms-auto">
        <a class="nav-link d-flex align-items-center" href="mailto:acontrol@blw.admin.ch" title="Rückmeldung per E-Mail">
          <i class="bi bi-envelope fs-4"></i>
        </a>
        <a class="nav-link d-flex align-items-center" href="https://github.com/blw-ofag-ufag/agricheck/issues/new?title=Bug%20Report:%20R%C3%BCckmeldung%20zur%20Agricheck-Webapplikation&body=Bitte%20beschreibe%20hier%20deinen%20Fehler%20und%20alle%20relevanten%20Details%20%28Schritte%2C%20Erwartetes%20Verhalten%2C%20tats%C3%A4chliches%20Ergebnis%2C%20Systeminformationen%2C%20Screenshots%29.%20Vielen%20Dank%21" target="_blank" title="Rückmeldung via GitHub">
          <i class="bi bi-github fs-4"></i>
        </a>
        <a class="nav-link d-flex align-items-center" href="about.html">
          <i class="bi bi-question-square fs-4"></i>
        </a>
      </div>
    </div>
  </nav>


  <div class="container py-4">

    <!-- Meta headline + date -->
    <h1 class="mb-2">Meine Agricheck-Liste</h1>
    <p id="metaDate" class="text-muted mb-4"></p>

    <!-- Toolbar (hidden for print) -->
    <div id="toolbar" class="d-print-none mb-3">
      <button id="printBtn"    class="btn btn-outline-secondary me-2">
        <i class="bi bi-printer"></i> Drucken / PDF
      </button>
      <button id="excelBtn"    class="btn btn-outline-secondary me-2">
        <i class="bi bi-file-earmark-excel"></i> Excel
      </button>
      <button id="copyLinkBtn" class="btn btn-outline-secondary">
        <i class="bi bi-clipboard"></i> Link kopieren
      </button>
    </div>

    <!-- Checklist content -->
    <div id="content"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Page logic -->
  <script type="module" src="js/checklist.js"></script>
</body>
</html>
